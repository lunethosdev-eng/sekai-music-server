<!DOCTYPE html>
<html lang="es" class="dark scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sekai Enterprise Audio Infrastructure & Dynamic APIs</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Syne:wght@500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        heading: ['Syne', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #030305;
            color: #f1f5f9;
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        .glass-panel {
            background: rgba(18, 20, 29, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.5);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.07);
        }

        .glass-button {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
        }

        .glass-input {
            background: rgba(10, 11, 16, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ffffff;
        }

        .view-section { display: none; opacity: 0; transition: opacity 0.3s ease-in-out; }
        .view-section.active { display: block; opacity: 1; }
    </style>
</head>
<body class="relative min-h-screen flex flex-col justify-between selection:bg-white selection:text-black pb-28 md:pb-24">

    <!-- Audio Element -->
    <audio id="main-audio-player" class="hidden"></audio>

    <!-- PANTALLA DE MANTENIMIENTO GLOBAL SUPERPUESTA -->
    <div id="maintenance-screen" class="fixed inset-0 z-[100] bg-black/95 backdrop-blur-2xl hidden flex flex-col items-center justify-center p-6 text-center">
        <div class="w-20 h-20 rounded-3xl bg-amber-500/10 border border-amber-500/20 flex items-center justify-center text-amber-400 mb-6 animate-pulse">
            <i class="fa-solid fa-screwdriver-wrench text-3xl"></i>
        </div>
        <h1 class="font-heading font-extrabold text-3xl sm:text-5xl text-white mb-3">Mantenimiento en Proceso</h1>
        <p id="maintenance-message-text" class="text-zinc-400 text-sm sm:text-base max-w-lg font-mono mb-8">
            El sistema se encuentra en mantenimiento programado. Por favor, reintente en unos minutos.
        </p>
    </div>

    <!-- NAVBAR RESPONSIVE -->
    <header class="sticky top-0 z-40 glass-panel border-b border-white/10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 sm:h-20 flex items-center justify-between">
            <a href="#" class="flex items-center space-x-3 shrink-0">
                <div class="w-8 h-8 sm:w-10 sm:h-10 rounded-xl bg-white text-black font-heading font-black text-xs sm:text-sm flex items-center justify-center tracking-tighter shadow-xl">
                    SK
                </div>
                <div>
                    <span class="font-heading font-extrabold text-base sm:text-lg tracking-wider text-white flex items-center gap-1.5">
                        SEKAI <span class="text-[9px] sm:text-[10px] font-mono font-medium px-1.5 py-0.5 rounded-full bg-white/10 text-zinc-300 border border-white/10">v5.0 ADAPTIVE</span>
                    </span>
                </div>
            </a>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 py-8 sm:py-12 flex-grow w-full relative text-center space-y-6">
        <h1 class="font-heading font-extrabold text-3xl sm:text-6xl text-white">
            Sekai Music API Enterprise
        </h1>
        <p class="text-zinc-400 text-sm sm:text-base max-w-xl mx-auto">
            Infraestructura de audio en tiempo real con Rate Limiting Adaptativo, protección anti-inspección y API Keys dedicadas.
        </p>
    </main>

    <!-- SCRIPT & FRONTEND LOGIC CON SEGURIDAD ANTI-INSPECCIÓN -->
    <script>
        // ===============================================
        // PROTECCIÓN ANTI-INSPECCIÓN Y BLOQUEO DE CÓDIGO
        // ===============================================
        
        // Bloquear menú contextual de clic derecho
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        });

        // Deshabilitar teclas de inspección de desarrollador
        document.addEventListener('keydown', function(e) {
            if (e.keyCode === 123 || 
               (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) ||
               (e.ctrlKey && e.keyCode === 85)) {
                e.preventDefault();
                return false;
            }
        });

        // Trampa contra apertura de DevTools (Debugger Loop)
        setInterval(function() {
            const start = performance.now();
            (function() {}.constructor("debugger")());
            const end = performance.now();
            if (end - start > 100) {
                document.body.innerHTML = `
                    <div style="background:#050508;color:white;text-align:center;padding:50px;font-family:monospace;height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;">
                        <h1 style="color:#ff3366;">🚨 Acceso Denegado</h1>
                        <p>Inspección de código detectada e interceptada por seguridad.</p>
                        <p style="color:#666;font-size:12px;">Mmm, eso está muy mal. Lárgate de acá y ponte a hacer tu trabajo bien.</p>
                    </div>`;
            }
        }, 1000);
    </script>
</body>
</html>
